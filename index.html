<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WeDo 2.0 Graficzny Kontroler</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0e1c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <div class="app-container">
        <!-- Panel górny: Status połączenia i bateria (Zminimalizowany dla telefonów) -->
        <header class="app-header">
            <button id="btn-bluetooth" class="btn-header bt-disconnected">
                <svg class="icon-bt" viewBox="0 0 24 24" width="20" height="20">
                    <path d="M17.71,7.71L12,2h-1v7.59L6.41,4.59L5,6l6,6l-6,6l1.41,1.41L11,14.41V22h1l5.71-5.71L13.41,12L17.71,7.71z M13,5.83 l1.88,1.88L13,9.59V5.83z M13,18.17v-3.76l1.88,1.88L13,18.17z"/>
                </svg>
            </button>
            <div id="battery-indicator" class="battery-status hidden">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <path d="M16 20H8V6H16V20ZM15.5 4H13V2H11V4H8.5C7.67 4 7 4.67 7 5.5V20.5C7 21.33 7.67 22 8.5 22H15.5C16.33 22 17 21.33 17 20.5V5.5C17 4.67 16.33 4 15.5 4Z" fill="#22c55e"/>
                </svg>
                <span id="battery-level">100%</span>
            </div>
        </header>

        <!-- Sekcja główna: Oś czasu (Program) -->
        <main class="program-area">
            <div class="timeline-container">
                <div id="program-timeline" class="timeline">
                    <!-- Klocki programu będą tu dodawane dynamicznie -->
                    <div class="timeline-block start-block" id="start-anchor">
                        <div class="block-icon">
                            <svg viewBox="0 0 24 24" width="30" height="30">
                                <path d="M14.4,6L14,4H5V21H7V14H12.6L13,16H20V6H14.4Z" fill="#22c55e"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Dolny panel: Zintegrowane sterowanie i paleta bloczków (Zoptymalizowane pod Landscape) -->
        <footer class="control-panel">
            <!-- Przyciski wykonania z lewej strony -->
            <div class="actions-row">
                <button id="btn-clear" class="btn-action btn-clear-danger">
                    <svg viewBox="0 0 24 24" width="22" height="22">
                        <path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z" fill="#ef4444"/>
                    </svg>
                </button>
                <button id="btn-play" class="btn-action btn-play-success">
                    <svg viewBox="0 0 24 24" width="32" height="32">
                        <path d="M8,5.14V19.14L19,12.14L8,5.14Z" fill="#ffffff"/>
                    </svg>
                </button>
                <button id="btn-stop" class="btn-action btn-stop-danger hidden">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path d="M6,6H18V18H6V6Z" fill="#ffffff"/>
                    </svg>
                </button>
            </div>

            <!-- Paleta bloczków z prawej strony (skrolowana w poziomie) -->
            <div class="palette-scroll-container">
                <div class="block-palette">
                    <!-- Silnik w prawo (Zielona strzałka) -->
                    <button class="palette-item" data-type="motor" data-dir="right" data-speed="rabbit">
                        <div class="palette-icon-bg motor-right-bg">
                            <svg viewBox="0 0 24 24" width="26" height="26">
                                <path d="M5,12 L19,12 M13,6 L19,12 L13,18" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                            </svg>
                        </div>
                    </button>

                    <!-- Silnik w lewo (Pomarańczowa strzałka) -->
                    <button class="palette-item" data-type="motor" data-dir="left" data-speed="rabbit">
                        <div class="palette-icon-bg motor-left-bg">
                            <svg viewBox="0 0 24 24" width="26" height="26">
                                <path d="M19,12 L5,12 M11,6 L5,12 L11,18" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                            </svg>
                        </div>
                    </button>

                    <!-- Zatrzymaj silnik (Czerwony stop) -->
                    <button class="palette-item" data-type="motor-stop">
                        <div class="palette-icon-bg stop-bg">
                            <svg viewBox="0 0 24 24" width="26" height="26">
                                <polygon points="8,2 16,2 22,8 22,16 16,22 8,22 2,16 2,8" fill="#ffffff"/>
                            </svg>
                        </div>
                    </button>

                    <!-- Diody LED (Światełko) -->
                    <button class="palette-item" data-type="led" data-color="blue">
                        <div class="palette-icon-bg led-bg">
                            <svg viewBox="0 0 24 24" width="26" height="26">
                                <path d="M12,2A7,7 0 0,0 5,9C5,12.63 7.39,15.7 10.76,16.5V19H13.24V16.5C16.61,15.7 19,12.63 19,9A7,7 0 0,0 12,2" fill="#ffffff"/>
                            </svg>
                        </div>
                    </button>

                    <!-- Zegar (Czekaj) -->
                    <button class="palette-item" data-type="wait" data-duration="1">
                        <div class="palette-icon-bg wait-bg">
                            <svg viewBox="0 0 24 24" width="26" height="26">
                                <path d="M6 2H18V8H18V8L14 12L18 16V16H18V22H6V16H6V16L10 12L6 8V8H6V2M8 4V7.5L12 11.5L16 7.5V4H8" fill="#ffffff"/>
                            </svg>
                        </div>
                    </button>

                    <!-- Głośnik (Dźwięk) -->
                    <button class="palette-item" data-type="sound" data-sound="cat">
                        <div class="palette-icon-bg sound-bg">
                            <svg viewBox="0 0 24 24" width="26" height="26">
                                <path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18,19.86 21,16.28 21,12 M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16 M3,9V15H7L12,20V4L7,9H3Z" fill="#ffffff"/>
                            </svg>
                        </div>
                    </button>
                    
                    <!-- Pętla (Powtarzanie) -->
                    <button class="palette-item" data-type="loop">
                        <div class="palette-icon-bg loop-bg">
                            <svg viewBox="0 0 24 24" width="26" height="26">
                                <path d="M19,8l-4,4h3c0,3.31-2.69,6-6,6c-1.01,0-1.97-0.25-2.8-0.7l-1.46,1.46C8.97,19.54,10.43,20,12,20c4.42,0,8-3.58,8-8h3L19,8z M6,12 c0-3.31,2.69-6,6-6c1.01,0,1.97,0.25,2.8,0.7l1.46-1.46C15.03,4.46,13.57,4,12,4c-4.42,0-8,3.58-8,8H1L5,16l4-4H6z" fill="#ffffff"/>
                            </svg>
                        </div>
                    </button>
                </div>
            </div>
        </footer>

        <!-- Okienka konfiguracyjne (Czysto graficzne, bez tekstu, dopasowane do wysokości landscape) -->
        
        <!-- Modal: Silnik (Kierunek, Port i Prędkość) -->
        <div id="modal-motor" class="modal-overlay hidden">
            <div class="modal-card wide-modal">
                <div class="modal-content horizontal-layout">
                    <!-- Kierunek (Strzałka w prawo lub w lewo) -->
                    <div class="setting-group compact-group">
                        <div class="direction-options">
                            <button id="motor-opt-dir-right" class="dir-btn" data-dir="right">
                                <svg viewBox="0 0 24 24" width="48" height="48">
                                    <path d="M5,12 L19,12 M13,6 L19,12 L13,18" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                                </svg>
                            </button>
                            <button id="motor-opt-dir-left" class="dir-btn" data-dir="left">
                                <svg viewBox="0 0 24 24" width="48" height="48">
                                    <path d="M19,12 L5,12 M11,6 L5,12 L11,18" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="divider-y"></div>

                    <!-- Port Silnika (Lewy, Oba, Prawy) -->
                    <div class="setting-group compact-group">
                        <div class="port-options">
                            <button class="port-btn" data-port="1" title="Lewy">
                                <svg viewBox="0 0 24 24" width="36" height="36">
                                    <rect x="6" y="4" width="12" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
                                    <circle cx="9" cy="8" r="2.5" fill="#22c55e"/>
                                    <circle cx="15" cy="8" r="2.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
                                </svg>
                            </button>
                            <button class="port-btn" data-port="both" title="Oba">
                                <svg viewBox="0 0 24 24" width="36" height="36">
                                    <rect x="6" y="4" width="12" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
                                    <circle cx="9" cy="8" r="2.5" fill="#22c55e"/>
                                    <circle cx="15" cy="8" r="2.5" fill="#22c55e"/>
                                </svg>
                            </button>
                            <button class="port-btn" data-port="2" title="Prawy">
                                <svg viewBox="0 0 24 24" width="36" height="36">
                                    <rect x="6" y="4" width="12" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
                                    <circle cx="9" cy="8" r="2.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
                                    <circle cx="15" cy="8" r="2.5" fill="#22c55e"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="divider-y"></div>
                    
                    <!-- Prędkość (Zwierzątka) -->
                    <div class="setting-group compact-group">
                        <div class="speed-options">
                            <button class="speed-btn" data-speed="turtle">
                                <span class="speed-emoji">🐢</span>
                            </button>
                            <button class="speed-btn" data-speed="rabbit">
                                <span class="speed-emoji">🐇</span>
                            </button>
                            <button class="speed-btn" data-speed="cheetah">
                                <span class="speed-emoji">🐆</span>
                            </button>
                        </div>
                    </div>
                </div>
                <button id="btn-close-motor" class="btn-modal-ok">👍</button>
            </div>
        </div>

        <!-- Modal: Stop Silnika (Wybór portu) -->
        <div id="modal-motor-stop" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-content">
                    <div class="setting-group">
                        <div class="port-options">
                            <button class="stop-port-btn" data-port="1" title="Lewy">
                                <svg viewBox="0 0 24 24" width="36" height="36">
                                    <rect x="6" y="4" width="12" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
                                    <circle cx="9" cy="8" r="2.5" fill="#ef4444"/>
                                    <circle cx="15" cy="8" r="2.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
                                </svg>
                            </button>
                            <button class="stop-port-btn" data-port="both" title="Oba">
                                <svg viewBox="0 0 24 24" width="36" height="36">
                                    <rect x="6" y="4" width="12" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
                                    <circle cx="9" cy="8" r="2.5" fill="#ef4444"/>
                                    <circle cx="15" cy="8" r="2.5" fill="#ef4444"/>
                                </svg>
                            </button>
                            <button class="stop-port-btn" data-port="2" title="Prawy">
                                <svg viewBox="0 0 24 24" width="36" height="36">
                                    <rect x="6" y="4" width="12" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
                                    <circle cx="9" cy="8" r="2.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
                                    <circle cx="15" cy="8" r="2.5" fill="#ef4444"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <button id="btn-close-motor-stop" class="btn-modal-ok">👍</button>
            </div>
        </div>

        <!-- Modal: LED (Paleta kolorów) -->
        <div id="modal-led" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-content">
                    <div class="color-row">
                        <button class="color-btn" data-color-val="pink" style="background-color: #ff007f;"></button>
                        <button class="color-btn" data-color-val="purple" style="background-color: #8b5cf6;"></button>
                        <button class="color-btn" data-color-val="blue" style="background-color: #3b82f6;"></button>
                        <button class="color-btn" data-color-val="cyan" style="background-color: #06b6d4;"></button>
                        <button class="color-btn" data-color-val="green" style="background-color: #10b981;"></button>
                        <button class="color-btn" data-color-val="yellow" style="background-color: #fbbf24;"></button>
                        <button class="color-btn" data-color-val="orange" style="background-color: #f97316;"></button>
                        <button class="color-btn" data-color-val="red" style="background-color: #ef4444;"></button>
                    </div>
                </div>
                <button id="btn-close-led" class="btn-modal-ok">👍</button>
            </div>
        </div>

        <!-- Modal: Czekanie (Tylko cyfry) -->
        <div id="modal-wait" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-content">
                    <div class="duration-options">
                        <button class="dur-btn" data-dur="1">1</button>
                        <button class="dur-btn" data-dur="2">2</button>
                        <button class="dur-btn" data-dur="3">3</button>
                        <button class="dur-btn" data-dur="5">5</button>
                    </div>
                </div>
                <button id="btn-close-wait" class="btn-modal-ok">👍</button>
            </div>
        </div>

        <!-- Modal: Dźwięki (Same emotki zwierząt) -->
        <div id="modal-sound" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-content">
                    <div class="sound-row">
                        <button class="sound-select-btn" data-sound-val="cat">🐱</button>
                        <button class="sound-select-btn" data-sound-val="dog">🐶</button>
                        <button class="sound-select-btn" data-sound-val="bird">🐦</button>
                        <button class="sound-select-btn" data-sound-val="robot">🤖</button>
                        <button class="sound-select-btn" data-sound-val="alarm">🚨</button>
                    </div>
                </div>
                <button id="btn-close-sound" class="btn-modal-ok">👍</button>
            </div>
        </div>
    </div>
    <script src="app.js?v=3"></script>
</body>
</html>
