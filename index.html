<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LEGO WeDo 2.0 Motor Lab 🏎️🤖</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="toy-app-container">
    <!-- Playful Header -->
    <header class="toy-header">
      <div class="toy-logo-group">
        <span class="toy-logo-emoji">🏎️🤖</span>
      </div>

      <div class="toy-hud">
        <!-- Battery Status -->
        <div class="toy-battery" id="batteryContainer" style="display: none;">
          <svg class="battery-svg" viewBox="0 0 24 12">
            <rect x="1" y="1" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="20" y="3" width="2" height="6" fill="currentColor"/>
            <rect id="batteryLevelBar" x="3" y="3" width="14" height="6" rx="1" fill="#10b981"/>
          </svg>
          <span id="batteryPercentage">--%</span>
        </div>

        <!-- Connection Buttons -->
        <button id="btnConnect" class="btn btn-connect">
          🔌
        </button>
        <button id="btnDisconnect" class="btn btn-disconnect" style="display: none;">
          ❌
        </button>
      </div>
    </header>

    <!-- Main Toy Dashboard -->
    <main class="toy-main-grid">
      
      <!-- LEFT COLUMN: Simulator & Manual Controls -->
      <div class="toy-left-col">
        
        <!-- Interactive Motor Simulation Widget -->
        <section class="toy-card sim-widget-card">
          <div class="toy-simulation-area">
            <!-- Simulated LEGO Wheel -->
            <div class="lego-wheel-container">
              <svg class="lego-wheel-svg" id="legoWheelSvg" viewBox="0 0 200 200">
                <defs>
                  <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="70%" stop-color="#2d2f33"/>
                    <stop offset="90%" stop-color="#1b1c1e"/>
                    <stop offset="100%" stop-color="#090a0a"/>
                  </radialGradient>
                  <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fcd34d"/>
                    <stop offset="50%" stop-color="#f59e0b"/>
                    <stop offset="100%" stop-color="#d97706"/>
                  </linearGradient>
                </defs>
                <!-- Tire Outer -->
                <circle cx="100" cy="100" r="90" fill="url(#tireGrad)" stroke="#111" stroke-width="4"/>
                <circle cx="100" cy="100" r="70" fill="none" stroke="#222" stroke-dasharray="8,6" stroke-width="4"/>
                <!-- Yellow Hub -->
                <circle cx="100" cy="100" r="50" fill="url(#hubGrad)"/>
                <!-- LEGO Hub Details -->
                <circle cx="100" cy="100" r="38" fill="none" stroke="#b45309" stroke-width="2"/>
                <circle cx="100" cy="100" r="16" fill="#1e293b" stroke="#0f172a" stroke-width="3" id="legoWheelCenter"/>
                <!-- Peg holes / spokes -->
                <g stroke="#78350f" stroke-width="2" fill="none">
                  <line x1="100" y1="50" x2="100" y2="150" />
                  <line x1="50" y1="100" x2="150" y2="100" />
                  <circle cx="100" cy="65" r="5" fill="#f59e0b"/>
                  <circle cx="100" cy="135" r="5" fill="#f59e0b"/>
                  <circle cx="65" cy="100" r="5" fill="#f59e0b"/>
                  <circle cx="135" cy="100" r="5" fill="#f59e0b"/>
                </g>
                <!-- Center Shaft cross -->
                <rect x="96" y="90" width="8" height="20" rx="1.5" fill="#e2e8f0"/>
                <rect x="90" y="96" width="20" height="8" rx="1.5" fill="#e2e8f0"/>
                <circle cx="100" cy="100" r="3" fill="#cbd5e1"/>
              </svg>
              <!-- Speedometer Popover bubble -->
              <div class="speed-bubble" id="speedDisplayBubble">
                🛑
              </div>
            </div>
          </div>
        </section>

        <!-- Speed Presets Card -->
        <section class="toy-card setup-card">
          <div class="toy-setup-row">
            <!-- Manual Run Speed Selector -->
            <div class="toy-setup-group">
              <div class="toy-speed-presets">
                <button class="btn-speed" data-speed="42">🐌</button>
                <button class="btn-speed active" data-speed="61">🐕</button>
                <button class="btn-speed" data-speed="100">⚡</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Manual Control (Hold-to-run) Card -->
        <section class="toy-card manual-card">
          <div class="manual-button-grid">
            <!-- Press and Hold Left -->
            <button class="btn-hold-run left-spin" id="btnHoldLeft" touch-action="none">
              <div class="btn-hold-icon">◀️🔄</div>
            </button>

            <!-- Press and Hold Right -->
            <button class="btn-hold-run right-spin" id="btnHoldRight" touch-action="none">
              <div class="btn-hold-icon">🔄▶️</div>
            </button>
          </div>
          <div style="display: flex; justify-content: center; margin-top: 10px;">
            <button class="btn-toy-brake" id="btnBrakeStop">🛑</button>
          </div>
        </section>

      </div>

      <!-- RIGHT COLUMN: Blocks Programmer & Sequence Timeline -->
      <div class="toy-right-col">
        
        <!-- Block Library (Toolbox) -->
        <section class="toy-card library-card">
          <div class="blocks-library">
            <!-- Motor blocks -->
            <button class="toy-block block-left" data-action="left" data-duration="1">
              <span>◀️ 1️⃣</span>
            </button>
            <button class="toy-block block-left" data-action="left" data-duration="2">
              <span>◀️ 2️⃣</span>
            </button>
            <button class="toy-block block-right" data-action="right" data-duration="1">
              <span>▶️ 1️⃣</span>
            </button>
            <button class="toy-block block-right" data-action="right" data-duration="2">
              <span>▶️ 2️⃣</span>
            </button>
            <!-- Stop block -->
            <button class="toy-block block-stop" data-action="stop" data-duration="1">
              <span>🛑 1️⃣</span>
            </button>
            
            <!-- Sound blocks -->
            <button class="toy-block block-sound" data-action="beep" data-tone="low">
              <span>🔊 🎵</span>
            </button>
            <button class="toy-block block-sound" data-action="beep" data-tone="high">
              <span>🔊 🎶</span>
            </button>

            <!-- LED blocks -->
            <button class="toy-block block-led block-led-red" data-action="led" data-color="red" data-color-idx="9">
              <span>🔴</span>
            </button>
            <button class="toy-block block-led block-led-green" data-action="led" data-color="green" data-color-idx="6">
              <span>🟢</span>
            </button>
            <button class="toy-block block-led block-led-blue" data-action="led" data-color="blue" data-color-idx="3">
              <span>🔵</span>
            </button>
            <button class="toy-block block-led block-led-rainbow" data-action="led" data-color="rainbow" data-color-idx="10">
              <span>🌈</span>
            </button>
          </div>
        </section>

        <!-- Sequence Workspace -->
        <section class="toy-card sequence-card">
          <!-- Timeline where blocks accumulate -->
          <div class="sequence-timeline" id="sequenceTimeline">
            <!-- Empty state illustration -->
            <div class="timeline-empty-state" id="timelineEmptyState">
              <div class="empty-icon-bubble">🧩</div>
            </div>
          </div>

          <!-- Sequence Controls -->
          <div class="sequence-actions">
            <button id="btnPlaySeq" class="btn-play">
              🏁
            </button>
            <button id="btnStopSeq" class="btn-stop" style="display: none;">
              🛑
            </button>
            <button id="btnClearSeq" class="btn-clear">
              🗑️
            </button>
            <div class="loop-checkbox-container">
              <label class="toy-switch">
                <input type="checkbox" id="chkLoopSeq">
                <span class="toy-switch-slider"></span>
              </label>
              <span class="loop-label">🔁</span>
            </div>
          </div>
        </section>

      </div>
    </main>

    <!-- Simple friendly copyright footer -->
    <footer class="toy-footer">
      <p class="copyright-info">LEGO® WeDo 2.0 Motor Playground &copy; 2026.</p>
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
